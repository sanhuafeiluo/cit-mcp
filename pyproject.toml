[project]
name = "cit"
version = "0.3.0"
description = "Context Information Tracker — git-style branching for Claude Code"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["claude", "mcp", "conversation", "branching", "context"]
dependencies = [
    "mcp>=1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/v3nividiv1ci/cit-mcp"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
